name: Run Headless Playwright Scraper

on:
  schedule:
    # Runs at 06:00 AM UTC every day
    - cron: '0 0,6,12,18 * * *'
  # Allows manual triggers from the GitHub UI
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check Expiration Date
        run: |
          # Set your target end date (YYYY-MM-DD)
          END_DATE="2026-09-11"
          CURRENT_DATE=$(date -u +%Y-%m-%d)
          
          if [ "$CURRENT_DATE" \> "$END_DATE" ]; then
            echo "Current date ($CURRENT_DATE) is past the end date ($END_DATE). Exiting workflow."
            exit 0
          fi
      
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas numpy google-api-python-client google-auth
      - name: Install Playwright browsers and OS dependencies
        run: |
          python -m playwright install chromium --with-deps

      - name: Run Playwright Script
        env:
          BLACKPUG_USERNAME: ${{ secrets.BLACKPUG_USERNAME }}
          BLACKPUG_PASSWORD: ${{ secrets.BLACKPUG_PASSWORD }}
          BLACKPUG_EVENTID: ${{ vars.BLACKPUG_EVENTID }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          python BlackPug_Download.py
