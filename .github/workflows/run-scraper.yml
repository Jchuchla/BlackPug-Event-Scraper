name: Run Headless Playwright Scraper

on:
  schedule:
    # Runs at 06:00 AM UTC every day
    - cron: '0 6 * * *'
  # Allows manual triggers from the GitHub UI
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright gspread

      - name: Install Playwright browsers and OS dependencies
        run: |
          python -m playwright install chromium --with-deps

      - name: Run Playwright Script
        env:
          BLACKPUG_USERNAME: ${{ secrets.BLACKPUG_USERNAME }}
          BLACKPUG_PASSWORD: ${{ secrets.BLACKPUG_PASSWORD }}
          BLACKPUG_EVENTID: ${{ vars.BLACKPUG_EVENTID }}
        run: |
          python BlackPug_Download.py

      - #name: Upload Downloaded CSV as Workflow Artifact
        #uses: actions/upload-artifact@v5
